[workspace]
resolver = "3"
members = [
    "crates/drm-uapi",
    "crates/drm-facade-sys",
    "crates/drm-core",
    "crates/drm-facade",
    "modules/drm_core",
    "examples/rdrmnull",
    "drivers/virtio-gpu",
    "xtask",
]
default-members = [
    "crates/drm-uapi",
    "crates/drm-facade-sys",
    "crates/drm-core",
    "crates/drm-facade",
    "modules/drm_core",
    "examples/rdrmnull",
    "drivers/virtio-gpu",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://code.aopc.cloud/illumos/illumos-drm"
rust-version = "1.97"

[workspace.dependencies]
drm-uapi = { path = "crates/drm-uapi" }
drm-core = { path = "crates/drm-core", default-features = false }
drm-facade = { path = "crates/drm-facade" }
drm-facade-sys = { path = "crates/drm-facade-sys" }
# illumos-ddi at the head of its graphics-dev branch: main with the
# stacked branches r3-kms-glue, r2-private-fd, r4-virtio, g1-gate-pin,
# r5a-char-table and g7-module-busy merged. Every illumos-ddi revision the
# illumos-drm topic branches pin is an ancestor of this commit.
ddi-sys = { git = "https://code.aopc.cloud/illumos/illumos-ddi.git", rev = "41aaab44ff8b54cf9e021e8764f0bbaad705e7b1" }
ddi = { git = "https://code.aopc.cloud/illumos/illumos-ddi.git", rev = "41aaab44ff8b54cf9e021e8764f0bbaad705e7b1", default-features = false }
serde_json = "1"

# Kernel modules are linked by `ld -ztype=kmod`, not by rustc. Keep debug
# info for mdb/DTrace; abort on panic (the target JSON enforces it too).
[profile.release]
debug = 2
panic = "abort"
lto = "thin"
codegen-units = 1

[profile.dev]
panic = "abort"
opt-level = 1

